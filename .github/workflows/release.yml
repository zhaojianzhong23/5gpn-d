name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          set -e
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dotmux-linux-$arch .
            sha256sum dotmux-linux-$arch > dotmux-linux-$arch.sha256
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dotmux-linux-amd64
            dotmux-linux-amd64.sha256
            dotmux-linux-arm64
            dotmux-linux-arm64.sha256
